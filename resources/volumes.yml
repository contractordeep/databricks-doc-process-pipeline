# Keep catalog_name and schema_name in sync with
# config/pipeline_config.yml storage.catalog and storage.schema.
resources:
  volumes:
    raw_docs:
      catalog_name: "main"
      schema_name: "doc_processing"
      name: "raw_docs"
      volume_type: "MANAGED"

    staging:
      catalog_name: "main"
      schema_name: "doc_processing"
      name: "staging"
      volume_type: "MANAGED"
