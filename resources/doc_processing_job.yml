# Keep cluster settings in sync with config/pipeline_config.yml compute section.
resources:
  jobs:
    doc_processing_job:
      name: "Document Processing Pipeline"

      job_clusters:
        - job_cluster_key: "doc_processing_cluster"
          new_cluster:
            spark_version: "17.1.x-scala2.12"
            node_type_id: "Standard_E4ds_v5"
            num_workers: 4
            spark_conf:
              "spark.databricks.sql.variant.enabled": "true"
              "spark.executor.cores": "2"
              "spark.task.cpus": "2"
              "spark.task.maxFailures": "1"

      tasks:
        - task_key: "sync_sources"
          job_cluster_key: "doc_processing_cluster"
          notebook_task:
            notebook_path: ../src/00_sync_sources.py
            base_parameters:
              config_path: "/Workspace/${workspace.file_path}/config/pipeline_config.yml"
            source: WORKSPACE

        - task_key: "ingest_documents"
          depends_on:
            - task_key: "sync_sources"
          job_cluster_key: "doc_processing_cluster"
          notebook_task:
            notebook_path: ../src/01_ingest_documents.py
            base_parameters:
              config_path: "/Workspace/${workspace.file_path}/config/pipeline_config.yml"
            source: WORKSPACE

        - task_key: "parse_documents"
          depends_on:
            - task_key: "ingest_documents"
          job_cluster_key: "doc_processing_cluster"
          notebook_task:
            notebook_path: ../src/02_parse_documents.py
            base_parameters:
              config_path: "/Workspace/${workspace.file_path}/config/pipeline_config.yml"
            source: WORKSPACE

        - task_key: "flatten_elements"
          depends_on:
            - task_key: "parse_documents"
          job_cluster_key: "doc_processing_cluster"
          notebook_task:
            notebook_path: ../src/03_flatten_elements.py
            base_parameters:
              config_path: "/Workspace/${workspace.file_path}/config/pipeline_config.yml"
            source: WORKSPACE

      permissions:
        - level: CAN_VIEW
          group_name: "users"
