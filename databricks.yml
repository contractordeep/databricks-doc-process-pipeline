bundle:
  name: doc-processing-pipeline

include:
  - resources/*.yml

# The workspace is determined by your active Databricks CLI profile:
#   - Default profile from ~/.databrickscfg is used automatically
#   - Override with: DATABRICKS_CONFIG_PROFILE=my-profile databricks bundle deploy
#   - Or set "host" below to pin a specific workspace
#
# All configuration lives in config/pipeline_config.yml.
# Edit that file to set catalog, schema, compute, sources, and processing options.

targets:
  default:
    default: true
